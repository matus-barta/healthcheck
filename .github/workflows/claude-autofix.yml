name: Claude autofix

# Nightly repair pass over pull requests whose CI is red.
#
# Why this is worth having here: renovate.json automerges passing minor and patch
# bumps straight to the branch, so an *open* Renovate pull request is, by
# construction, a bump that already broke the build. This workflow picks one of
# those up while nobody is awake, lets Claude try the smallest fix, and leaves the
# result on the pull request for a human to review and merge. It never merges.
#
# Cost control is the whole design. Claude authenticates with a Claude Pro
# subscription token, so every run spends from the same budget the owner uses
# during the day. The `select` job below is nothing but GitHub API calls - it
# costs no Claude tokens at all - and the expensive `fix` job starts only when
# `select` found exactly one pull request worth the spend. On a night with
# nothing red, this workflow costs a few seconds of Actions time and no tokens.

on:
  schedule:
    # Both entries mean 03:10 Europe/Bratislava. Only one of them survives the
    # local-hour guard in `select`, so exactly one run happens per night in
    # either half of the year:
    #   01:10 UTC = 03:10 CEST (summer, UTC+2)  -> guard sees hour 3, proceeds
    #   02:10 UTC = 04:10 CEST                  -> guard sees hour 4, stops
    #   01:10 UTC = 02:10 CET  (winter, UTC+1)  -> guard sees hour 2, stops
    #   02:10 UTC = 03:10 CET                   -> guard sees hour 3, proceeds
    #
    # 03:10 satisfies both halves of the brief. It is past the ~03:00 weekend
    # cut-off when the owner stops using Claude, and it is early enough that the
    # 5-hour usage window this run opens has expired again before 09:00, when the
    # owner starts. The :10 offset buys roughly 50 minutes of slack, because
    # GitHub delays scheduled runs under load and silently drops ones it cannot
    # place; a run delayed past 04:00 skips the night rather than eating into it.
    - cron: '10 1 * * *'
    - cron: '10 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report which PR would be fixed, then stop without spending tokens'
        type: boolean
        default: true

# Least privilege by default; the fix job opts back up to what it needs.
permissions:
  contents: read

# Two overlapping nights would spend two budgets. Queue, never cancel: a run that
# is mid-push must be allowed to finish.
concurrency:
  group: claude-autofix
  cancel-in-progress: false

jobs:
  # Free triage. Everything expensive is gated behind this job's output.
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      pr: ${{ steps.pick.outputs.pr }}
      head_ref: ${{ steps.pick.outputs.head_ref }}
      prompt: ${{ steps.prompt.outputs.text }}
    steps:
      # github-script cannot require a file that is not on disk, and this is the
      # only reason the triage job checks anything out. A `schedule` run always
      # gets the default branch, which is the version of the script to trust.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Pick one failing pull request
        id: pick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const selectFailingPr = require('./.github/scripts/select-failing-pr.js');
            await selectFailingPr({ github, context, core });

      # Deliberately built here rather than in `fix`. This job has the default
      # branch checked out; `fix` has the pull request's own branch, and a pull
      # request must not get to rewrite the instructions used to repair it.
      - name: Build the prompt
        id: prompt
        if: steps.pick.outputs.pr != ''
        env:
          PR_NUMBER: ${{ steps.pick.outputs.pr }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo 'text<<CLAUDE_AUTOFIX_PROMPT'
            # Drop the file's HTML comment header - it explains the file to a
            # reader, not to Claude - then fill in the two placeholders.
            sed -e '/^<!--/,/^-->/d' .github/prompts/claude-autofix.md \
              | sed -e '/./,$!d' \
                    -e "s/{{PR_NUMBER}}/$PR_NUMBER/g" \
                    -e "s|{{REPOSITORY}}|$REPOSITORY|g"
            echo 'CLAUDE_AUTOFIX_PROMPT'
          } >> "$GITHUB_OUTPUT"

  fix:
    needs: select
    if: needs.select.outputs.pr != '' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    # A runaway job is the expensive failure mode. --max-turns below is the real
    # cap; this is the backstop for a wedged process.
    timeout-minutes: 25
    permissions:
      contents: write # Claude pushes the fix to the pull request branch
      pull-requests: write # ...and comments on it when it cannot find one
      issues: write # the action posts its progress through the issues API
      actions: read # read the failing CI logs
      id-token: write # required for the action's default GitHub App auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.select.outputs.head_ref }}
          # Claude reads the recent log to match the repo's commit style.
          fetch-depth: 0
          # Deliberate: without this, checkout leaves GITHUB_TOKEN in the git
          # remote, Claude's push authenticates with it, and GitHub refuses to
          # start workflows for commits pushed by GITHUB_TOKEN - so CI would
          # never re-run and the fix could never be shown to work. Dropping the
          # credentials lets the action push as the Claude GitHub App instead.
          persist-credentials: false

      # The runner image ships neither pnpm nor a pinned Node, and step 3 of the
      # prompt asks Claude to prove the fix with pnpm build/test/lint. Same two
      # steps as docker-publish.yml and lint.yml, same Node 24.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # no version here on purpose: package.json's packageManager field is
          # the single source of truth, and this action errors if both are set
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache-dependency-path: ./pnpm-lock.yaml
          cache: 'pnpm'

      - uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1
        env:
          # Lets Claude read the failing job's logs with `gh run view`. This is
          # the read path only; the push above goes through the action's own
          # GitHub App credentials, not this token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No github_token on purpose - see persist-credentials above.
          prompt: ${{ needs.select.outputs.prompt }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
