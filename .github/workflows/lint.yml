name: Lint check
on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write # the failure path comments on the PR
jobs:
  lint-check:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # no version here on purpose: package.json's packageManager field is
          # the single source of truth, and this action errors if both are set
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache-dependency-path: ./pnpm-lock.yaml
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Run lint
        id: lint
        run: pnpm run lint

      - name: Comment on how to fix lint issue
        if: (github.event_name == 'pull_request') && (failure() && steps.lint.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '‼️ Please run `pnpm run format` on your PR! Thank you. ‼️'
            })
